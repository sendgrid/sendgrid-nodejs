name: Test and Deploy
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run automatically at 8AM PST Monday-Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  test:
    name: Test - Node ${{ matrix.node }}
    runs-on: ubuntu-x64
    if: github.repository_owner == 'sendgrid'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [ 20, 22, 24 ]
    steps:
      - name: Checkout sendgrid-nodejs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@0375437914d535a5fb178bdbfdb5d51bdde2616e # v1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run Tests
        run: make install && make test

  deploy:
    name: Deploy
    if: success() && github.ref_type == 'tag' && github.repository_owner == 'sendgrid'
    needs: [ test ]
    runs-on: ubuntu-x64
    environment:
      name: production
      url: https://www.npmjs.com/package/@sendgrid/mail/v/${{ github.ref_name }}
    permissions:
      contents: write          # required for creating GitHub Release
      id-token: write          # required for npm OIDC trusted publishing
    steps:
      - name: Checkout sendgrid-nodejs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The release action verifies refs/tags/<tag> in the local clone.
          fetch-depth: 0

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@0375437914d535a5fb178bdbfdb5d51bdde2616e # v1

      # Node 24+ required for npm OIDC trusted publisher support (npm >= 11.5.1)
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Create GitHub Release
        uses: twilio/sdk-actions/github-release@9b1c3222c9ffe38aadedb11c5b9f5a172b5e9951 # v1
        with:
          changelog-file: CHANGELOG.md
          footer: '**[npm](https://www.npmjs.com/package/@sendgrid/mail/v/${{ github.ref_name }})**'

      - run: npm install

      # Lerna monorepo: publish every package whose version isn't on npm yet, via OIDC trusted publishing.
      # Each @sendgrid/* package needs a trusted publisher configured on npmjs.com for this repo and workflow.
      - name: Publish to npm
        run: ./node_modules/.bin/lerna publish from-package --yes --no-verify-access
        env:
          npm_config_provenance: 'true'

